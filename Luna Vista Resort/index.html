<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Vista Resort</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header class="resort-header">
        <h1><a href="#">Luna Vista Resort</a></h1>
        <nav class="resort-nav">
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#about">About Luna Vista</a></li>
                <li><a href="#reservation">Reservation</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Gallery Section -->
        <section id="gallery" class="gallery-section">
            <img src="assets/room.jpg" alt="Resort Room Interior" class="gallery-img">
            <img src="assets/resort-view.jpg" alt="Resort Ocean View" class="gallery-img">
        </section>

        <!-- About Section -->
        <section id="about" class="about-section">
            <h2>About Luna Vista Resort</h2>
            <p>Experience luxury by the sea at Luna Vista Resort – where stunning ocean views, elegant accommodations, and world-class service come together to create your perfect getaway.</p>
        </section>

        <!-- Reservation Form Section -->
        <section id="reservation" class="reservation-section">
            <h2>Reservation Form</h2>
            <form id="reservation-form" class="reservation-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="checkin">Check-In Date</label>
                    <input type="date" id="checkin" required>
                </div>
                <div class="form-group">
                    <label for="checkout">Check-Out Date</label>
                    <input type="date" id="checkout" required>
                </div>
                <div class="form-group">
                    <label for="guests">Number of Guests</label>
                    <input type="number" id="guests" min="1" max="10" placeholder="1" required>
                </div>
                <button type="submit" class="submit-btn">Book Now <i class="fas fa-calendar-check"></i></button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
